<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Trading Bot Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="top-nav">
            <div class="logo">
                <i class="fa-solid me-2 fa-chart-line"></i> EXNESS <span>CLOUD BOT</span>
            </div>
            <div class="user-status">
                <span class="status-indicator" id="statusDot"></span>
                <span id="statusText">Disconnected</span>
            </div>
        </header>

        <main class="dashboard-grid">
            
            <section class="card account-card">
                <h3><i class="fa-solid fa-link"></i> MT5 Account Connect</h3>
                <form id="connectForm">
                    <div class="input-group">
                        <label>MT5 Login ID</label>
                        <input type="text" id="mt5_login" placeholder="e.g. 12345678" required>
                    </div>
                    <div class="input-group">
                        <label>MT5 Password</label>
                        <input type="password" id="mt5_password" placeholder="••••••••" required>
                    </div>
                    <div class="input-group">
                        <label>Exness Server</label>
                        <input type="text" id="mt5_server" placeholder="Exness-MT5Real10" required>
                    </div>
                    <div class="input-row">
                        <div class="input-group">
                            <label>Symbol</label>
                            <select id="symbol">
                                <option value="XAUUSD">XAUUSD (Gold)</option>
                                <option value="EURUSD">EURUSD</option>
                                <option value="GBPUSD">GBPUSD</option>
                                <option value="BTCUSD">BTCUSD</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label>Risk %</label>
                            <input type="number" id="risk_percent" value="1.0" step="0.1" min="0.1" max="10">
                        </div>
                    </div>
                    <button type="submit" id="btnConnect" class="btn-primary">
                        <i class="fa-solid fa-plug"></i> Connect & Start Auto-Trade
                    </button>
                </form>
            </section>

            <section class="card chart-card">
                <h3><i class="fa-solid fa-chart-area"></i> Live Market Chart</h3>
                <div id="tradingview_chart" class="chart-container"></div>
            </section>

            <section class="card trades-card">
                <div class="table-header">
                    <h3><i class="fa-solid fa-list-check"></i> Live Auto Trades & Signals</h3>
                    <button id="btnRefresh" class="btn-secondary"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
                </div>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Time</th>
                                <th>Symbol</th>
                                <th>Type</th>
                                <th>Lot Size</th>
                                <th>Entry Price</th>
                                <th>S/L</th>
                                <th>T/P</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="tradesTableBody">
                            <tr>
                                <td colspan="8" class="no-data">Koi active trade nahi hai. Form fill karke account connect karein.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="app.js"></script>
</body>
</html>
